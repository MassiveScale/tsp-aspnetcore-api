name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC provenance) needs npm 11.5.1 or later. Keep this
      # pinned so a new npm release cannot change how a release is published.
      - name: Update npm
        run: npm install -g npm@11.13.0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build & Test
        run: npm test

      - name: Verify version matches release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION, tag=$GITHUB_REF_NAME"
            exit 1
          fi

      - name: Publish
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-.*$ ]]; then
            echo "Publishing prerelease version $PKG_VERSION with --tag beta"
            npm publish --access public --provenance --tag beta
          else
            echo "Publishing stable version $PKG_VERSION"
            npm publish --access public --provenance
          fi
